<output id="output"></output>
<!-- https://www.jsdelivr.com/package/npm/markdown -->
<script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>

<script>
  const output = document.getElementById('output');

  (async () => {
    const initialPrompts = [
        {
            role: 'system',
            content: 'voce é um assistente de IA que responde de forma clara e objetiva'
        } 
    ]
    const question = 'Quem inventou o Python?'
    output.innerHTML = "Gerando a resposta..."
    const session = await LanguageModel.create({
        expectedInputLanguages: ['en', 'pt'],
        expectedOutputLanguages: ['en', 'pt'],
        initialPrompts: initialPrompts
    });

    const responseStream = await session.promptStreaming([
        {
            role: 'user',
            content: question
        }
    ]);
    output.innerHTML = ""
    let fullText = ""
    for await (const token of responseStream) {
        //output.innerHTML += markdown.toHTML(chunk.content);
        console.log(token);
        fullText += token;
        output.innerHTML = markdown.toHTML(fullText);
    }
  })();
</script>
